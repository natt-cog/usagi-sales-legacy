services:
  db:
    image: postgres:9.6
    environment:
      POSTGRES_DB: usagi
      POSTGRES_USER: usagi
      POSTGRES_PASSWORD: usagi
      TZ: Asia/Tokyo
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  web:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - ./work:/work
volumes:
  dbdata:
